<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
    <div class="container">
        <header class="hero">
            <div class="hero__content">
                <h1>Oonan matkat</h1>
                <p>Unelmiesi loma alkaa täältä!</p>
            </div>
        </header>
        <nav>
            <div class="sidebar">
                <a href="#etusivu"><i class="fa fa-fw fa-home"></i> Etusivu</a>
                <a href="#matkakohteet"><i class="fa fa-fw fa-map-marker"></i> Matkakohteet</a>
                <a href="#kokemukset"><i class="fa fa-fw fa-star"></i> Kokemukset</a>
                <a href="#ota-yhteytta"><i class="fa fa-fw fa-envelope"></i> Ota yhteyttä</a>
            </div>
        </nav>
        <main>
            <section class="kuva1 kuva-alue"><img src="lentokone.jpg" alt="Lentokone" class="skaalaus"></section>
            <section class="kuva2 kuva-alue"><img src="lentokentta.jpg" alt="Lentokenttä" class="jatkuva_zoomaus"></section>
            <section class="kuva3 kuva-alue"><img src="auto.jpg" alt="Auto" class="tarkentuva-kuva"></section>
            <section class="kuva4 kuva-alue"><img src="vene.jpg" alt="Vene" class="jatkuva-sumennus"></section>
            <section class="kuva5 kuva-alue"><img src="maisema.jpg" alt="Maisema" class="mustavalko"></section>
            <section class="kuva6 kuva-alue"><img src="ranta.jpg" alt="Ranta" class="mustavalkoLataus"></section>
        </main>
        <aside class="mainos1"><img src="mainos.jpg" class="mainoskuva" alt="digitaide kuvituskuva matkailusta"></aside>
        <aside class="mainos2"><h2>Black Friday <br>-10% matkapaketeista joulukuun ajan!</h2></aside>
    </div>
</body>
</html>
